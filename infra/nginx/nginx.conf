# ---------------------------------------------------------------------------
# Maghreb Connect – Nginx edge proxy configuration (production)
#
# Topology:
#   browser :80 -> nginx
#                 ├── /            proxied to frontend-static (built SPA;
#                 │                  its own nginx serves dist/ + config.json)
#                 ├── /api/        -> backend:8000  (Django REST API)
#                 ├── /admin/      -> backend:8000  (Django admin)
#                 ├── /static/     -> local dir from shared collectstatic volume
#                 └── /healthz     -> local 204 (container healthcheck)
#
# NOTE on /static/: Django's STATIC_URL is "static/" and STATIC_ROOT is
# /app/staticfiles, collected into the named volume `static_data`, mounted
# read-only here at /srv/static. Gunicorn runs with --umask 022 so nginx
# (uid 101) can read it.
#
# TLS: terminate at a cloud LB in front of this container, or mount certs
# and add a 443 server block + redirect when you have a domain.
# ---------------------------------------------------------------------------

upstream mc_backend {
    server backend:8000;
    keepalive 16;
}

upstream mc_frontend {
    server frontend-static:80;
    keepalive 8;
}

# Rate-limit anonymous API bursts (adds a second layer on top of DRF
# throttling). ~10 req/s/IP, small burst allowance.
limit_req_zone $binary_remote_addr zone=mc_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Reasonable body cap for submission payloads (JSON, no file uploads yet).
    client_max_body_size 1m;

    # Security headers (kept minimal & safe for an SPA + JSON API).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # --- Container healthcheck endpoint -----------------------------------
    location = /healthz {
        access_log off;
        return 204;
    }

    # --- Django static files (admin assets) from collectstatic volume ------
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- Django REST API ----------------------------------------------------
    location /api/ {
        limit_req zone=mc_api burst=20 nodelay;
        proxy_pass http://mc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # --- Django admin ---------------------------------------------------------
    location /admin/ {
        proxy_pass http://mc_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # --- Everything else: built React SPA (served by frontend-static) --------
    # Proxied instead of root-copying so the runtime-rendered /config.json
    # (tile style URL etc.) stays owned by the frontend image. The frontend
    # container already does try_files -> index.html for SPA routing.
    location / {
        proxy_pass http://mc_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
